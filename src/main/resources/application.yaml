server:
  port: 8080

spring:
  application:
    name: raizes-nordeste-api

  # Credenciais de acesso ao Banco de Dados H2.
  datasource:
    url: jdbc:h2:mem:raizesdb
    driverClassName: org.h2.Driver
    username: admin
    password: admin

  # Credenciais de acesso web para o Spring Security.
  security:
    user:
      name: admin
      password: admin

  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Configurações personalizadas da API
api:
  security:
    jwt:
      secret: YmFja2VuZC1yYWl6ZXMtbm9yZGVzdGUtZW50ZXJwcmlzZS1rZXk=